services:
  - type: web
    name: malaria-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    autoDeploy: true

  - type: web
    name: malaria-streamlit
    runtime: docker
    dockerfilePath: ./Dockerfile.streamlit
    plan: free
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        value: https://malaria-api-vuzw.onrender.com